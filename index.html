<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#CCC9DC">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>쮸카이브</title>
<meta name="description" content="엔믹스 지우 영상 아카이브">
<meta property="og:title" content="쮸카이브">
<meta property="og:description" content="엔믹스 지우 영상 아카이브">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* ===== 컴백 테마: 컴백마다 이 블록의 색과 logo.svg 파일만 바꾸면 돼요 ===== */
:root{
  --bg:#CCC9DC;        /* 배경색 */
  --logo:#F1F3E4;      /* 로고 색 */
  --logo-ratio:286/92; /* 로고 가로/세로 비율 (svg의 viewBox 숫자) */
  --surface:#E4E2EC;   /* 입력칸·상자 */
  --fg:#2A2740;        /* 본문 글자 */
  --muted:#5C5873;     /* 흐린 글자 */
  --line:#B4B0C8;      /* 구분선 */
  --chip:#BCB8D0;      /* 카테고리 태그 */
  --accent:#4E3F86;    /* 강조색 */
  --accent-ink:#F1F3E4;
  --butter:#F1F3E4;    /* '지우 단독' 태그 */
  --latin:"Montserrat", "IBM Plex Sans KR", system-ui, sans-serif;
  --body:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --gut:clamp(16px,3.2vw,48px);
  color-scheme:light;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;scroll-padding-top:84px}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55;padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gut{padding-left:max(var(--gut),env(safe-area-inset-left,0px));padding-right:max(var(--gut),env(safe-area-inset-right,0px))}

/* 상단: 왼쪽 로고, 오른쪽 메뉴 */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding-block:calc(14px + env(safe-area-inset-top,0px)) 14px;background:var(--bg)}
.home{display:block;line-height:0;text-decoration:none}
.logo{display:block;width:clamp(84px,7vw,104px);aspect-ratio:var(--logo-ratio);background:var(--logo);-webkit-mask:url(logo.svg) no-repeat center/contain;mask:url(logo.svg) no-repeat center/contain;transition:opacity .2s}
.home:hover .logo{opacity:.75}
.burger{width:44px;height:44px;border:0;background:none;cursor:pointer;display:grid;place-items:center;color:var(--logo)}
.burger svg{width:30px;height:30px}

/* 대표 영상 */
.hero{padding-block:clamp(32px,7vh,88px) 0}
.hero-in{max-width:1180px;margin:0 auto}
#videos,#profile,#insta{max-width:calc(1180px + 2*var(--gut));margin-inline:auto}
.hero-frame{aspect-ratio:16/9;max-width:100%;background:#000;overflow:hidden}
.hero-frame iframe{width:100%;height:100%;border:0;display:block}
.hero-cap{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;padding-top:14px}
.hero-cap .album{font-family:var(--latin);font-weight:700;font-size:clamp(20px,2.4vw,30px);letter-spacing:-.01em;color:var(--logo)}
.hero-cap .song{font-weight:600;color:var(--logo);font-size:clamp(15px,1.6vw,19px)}

main section{padding-block:44px 0}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px}
.sec-head h2{margin:0;font-family:var(--latin);font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.sec-head h2 b{font-family:var(--body);font-size:20px;letter-spacing:0;color:var(--fg);margin-left:10px;text-transform:none}
.more{border:0;background:none;color:var(--accent);cursor:pointer;font-weight:600;font-size:14px;padding:4px 0}

/* 영상 줄 (포스터 카드) */
.row-title{margin:0 0 16px;font-weight:700;font-size:clamp(22px,2.2vw,30px);letter-spacing:-.01em}
.shelf{display:grid;grid-auto-flow:column;grid-auto-columns:clamp(150px,15vw,250px);gap:clamp(12px,1.6vw,24px);overflow-x:auto;padding-bottom:12px;scroll-snap-type:x mandatory;scrollbar-width:thin}
.shelf>*{scroll-snap-align:start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(150px,15vw,250px),1fr));gap:clamp(12px,1.6vw,24px)}
.card{background:none;border:0;padding:0;cursor:pointer;display:block;min-width:0;border-radius:10px;overflow:hidden;position:relative;aspect-ratio:3/4;max-width:100%;background-color:var(--chip)}
.card img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s}
.card:hover img{transform:scale(1.05)}
.card .nothumb{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-family:var(--mono);font-size:13px}
.vhead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.vclear{border:1px solid var(--line);background:transparent;border-radius:50%;width:40px;height:40px;cursor:pointer;font-size:20px;line-height:1;flex:none}
.vnone{color:var(--muted);margin:0}
.igrid{columns:3 300px;column-gap:18px}
.igrid>.sns{break-inside:avoid;margin:0 0 18px}
.igrid .sns>*{min-width:0!important;max-width:100%!important;margin:0!important}
.igrid .instagram-media{width:100%!important}
.igrid .instagram-media{background:var(--surface)!important;border:0!important;border-radius:10px!important}

/* 프로필: 사진 + 뒤 사각형, 오른쪽 아래 이름과 정보 */
.profile{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:clamp(28px,5vw,80px);align-items:center;padding-top:12px}
.pphoto{position:relative;padding:clamp(20px,3vw,40px) 0 0 clamp(20px,3vw,40px);max-width:560px}
.pphoto::before{content:"";position:absolute;left:0;top:0;width:88%;height:88%;background:var(--surface)}
.pphoto img{position:relative;width:100%;aspect-ratio:1000/1274;object-fit:cover;box-shadow:14px 18px 34px rgba(30,24,60,.28)}
.pname{font-family:var(--latin);font-weight:700;font-size:clamp(34px,4vw,52px);line-height:1;letter-spacing:.06em;margin:0 0 20px}
dl.pinfo{margin:0;display:grid;grid-template-columns:max-content minmax(0,1fr);gap:10px 22px;font-size:15px}
dl.pinfo dt{color:var(--muted);font-weight:500}
dl.pinfo dd{margin:0;font-weight:600;overflow-wrap:anywhere;white-space:pre-line}
dl.pinfo dd small{font-weight:500;color:var(--muted);margin-left:6px}

/* 메뉴 (전체 화면) */
.menu{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;overflow-y:auto}
.menu .top{position:static;background:transparent}
.menu-body{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:28px;padding-block:24px 60px}
.msearch{display:flex;align-items:center;gap:10px;border-bottom:2px solid var(--fg);width:min(420px,100%);padding:6px 2px}
.msearch svg{width:24px;height:24px;flex:none}
.msearch input{flex:1;min-width:0;border:0;background:transparent;font-size:20px;font-weight:600;padding:6px 0;outline:none}
.mlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;width:min(420px,100%)}
.mlist button,.mlist a{display:block;text-decoration:none;border:0;background:none;cursor:pointer;font-weight:700;font-size:clamp(28px,4.2vw,42px);letter-spacing:.04em;padding:4px 0;text-align:left;color:var(--fg);transition:color .15s,transform .15s}
.mlist button:hover,.mlist a:hover{color:var(--logo);transform:translateX(4px)}
.mlist .en{font-family:var(--latin);font-size:12px;letter-spacing:.16em;color:var(--muted);margin-left:12px;vertical-align:middle;font-weight:600}

/* 재생창 */
.modal{position:fixed;inset:0;background:rgba(18,14,32,.84);display:grid;place-items:center;z-index:70;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.player{width:min(1100px,100%);background:var(--surface);border-radius:12px;overflow:hidden}
.player .frame{aspect-ratio:16/9;max-width:100%;background:#000}
.player iframe{width:100%;height:100%;border:0;display:block}
.player .info{padding:14px 16px;display:flex;gap:12px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.player .info h3{margin:4px 0 0;font-size:17px;min-width:0;overflow-wrap:anywhere}
.player .info a{color:var(--accent);font-size:13px;white-space:nowrap}
.close{background:var(--fg);color:var(--bg);border:0;border-radius:8px;padding:6px 12px;cursor:pointer}

/* 관리자 */
.hidechk{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;margin-top:12px;cursor:pointer}
.yt.have{opacity:.55}
.ytres{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:12px}
.yt{display:flex;flex-direction:column;gap:6px;background:var(--bg);border-radius:10px;padding:8px;min-width:0}
.yt img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:6px}
.yt .t{font-size:13px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.yt .c{font-size:12px;color:var(--muted);font-family:var(--mono)}
.yt .row{display:flex;gap:6px}
.yt select{flex:1;min-width:0;padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-size:13px}
.yt button{border:0;border-radius:6px;background:var(--accent);color:var(--accent-ink);padding:6px 10px;cursor:pointer;font-weight:600;font-size:13px}
.yt button:disabled{background:var(--chip);color:var(--muted);cursor:default}
.admin{margin-top:28px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:20px}
.admin h2{margin:0 0 4px;font-size:20px}
.admin .hint{color:var(--muted);font-size:13px;margin:0 0 16px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;min-width:0}
.form .wide{grid-column:1/-1}
.form input,.form select{padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-weight:400}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{border:1px solid var(--line);background:var(--bg);padding:9px 14px;border-radius:8px;cursor:pointer;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.msg{font-size:13px;color:var(--accent);min-height:1.4em;margin:8px 0 0}
.drafts{margin-top:16px;display:flex;flex-direction:column;gap:6px}
.draft{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 10px;background:var(--bg);border-radius:8px;font-size:13px}
.draft span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.draft button{border:0;background:none;color:var(--muted);cursor:pointer;flex:none}
textarea{width:100%;min-height:120px;margin-top:10px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--bg);font-family:var(--mono);font-size:12px}
main{padding-bottom:72px}

@media (max-width:760px){.profile{grid-template-columns:minmax(0,1fr)}.pphoto{max-width:420px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>
<header class="top gut">
  <a class="home" href="./" title="메인 화면으로"><span class="logo" role="img" aria-label="쮸카이브"></span></a>
  <button class="burger" id="open-menu" aria-label="메뉴 열기" aria-expanded="false"><svg viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 9h24M3 15h24M3 21h24"/></svg></button>
</header>

<main>
  <section class="hero gut" id="hero" aria-label="대표 영상">
    <div class="hero-in">
      <div class="hero-frame"><div id="hero-frame"></div></div>
    </div>
  </section>

  <section class="gut" id="videos">
    <div class="vhead"><h2 class="row-title" id="vtitle">최근 추가</h2><button class="vclear" id="vclear" aria-label="메인으로" hidden>×</button></div>
    <div class="shelf" id="grid"></div>

    <section class="admin" id="admin" hidden>
      <h2>유튜브에서 찾기</h2>
      <p class="hint">API 키는 이 브라우저에만 저장되고 사이트 코드에는 들어가지 않아요.</p>
      <div class="form">
        <label class="wide">API 키<input id="yt-key" type="password" placeholder="AIza로 시작하는 키" autocomplete="off"></label>
        <label>찾는 방식<select id="yt-mode"><option value="search">유튜브 전체 검색</option><option value="channel">특정 채널 안에서</option></select></label>
        <label class="wide" id="yt-ch-wrap" hidden>채널<input id="yt-ch" placeholder="채널 주소 또는 @아이디 (예: @NMIXX_official)"></label>
        <label class="wide"><span id="yt-q-label">검색어</span><input id="yt-q" value="#지우 #NMIXX"></label>
        <label id="yt-order-wrap">정렬<select id="yt-order"><option value="relevance">관련성</option><option value="date">최신순</option><option value="viewCount">조회수</option></select></label>
        <label>기간 시작<input id="yt-after" type="date"></label>
        <label>기간 끝<input id="yt-before" type="date"></label>
      </div>
      <label class="hidechk"><input type="checkbox" id="yt-hide" checked> 이미 목록에 있는 영상 숨기기</label>
      <div class="btns"><button class="btn primary" id="yt-go">검색</button><button class="btn" id="yt-more" hidden>더 보기</button><button class="btn" id="yt-stop" hidden>멈추기</button></div>
      <p class="msg" id="yt-msg"></p>
      <div class="ytres" id="yt-res"></div>

      <h2 style="margin-top:28px">영상 추가 (관리자)</h2>
      <p class="hint">여기서 추가한 영상은 이 브라우저에만 미리 보입니다. 다 넣은 뒤 <b>videos.js 내용 복사</b>를 눌러 videos.js 파일에 통째로 붙여넣으면 모두에게 보여요.</p>
      <div class="form">
        <label class="wide">유튜브 링크<input id="f-url" placeholder="https://www.youtube.com/watch?v=… 또는 youtu.be/…"></label>
        <label class="wide">제목 <small style="font-weight:400;color:var(--muted)">(링크를 넣으면 자동으로 채워져요)</small><input id="f-title"></label>
        <label>날짜<input id="f-date" type="date"></label>
        <label>카테고리<select id="f-cat"></select></label>
        <label>단독/단체<select id="f-group"><option>단독</option><option>단체</option></select></label>
        <label>메모<input id="f-note" placeholder="예: 생일 라이브, 엔딩요정"></label>
      </div>
      <div class="btns">
        <button class="btn primary" id="add">추가</button>
        <button class="btn" id="export">videos.js 내용 복사</button>
        <button class="btn" id="clear">미리보기 비우기</button>
      </div>
      <p class="msg" id="msg"></p>
      <div class="drafts" id="drafts"></div>
      <textarea id="out" readonly hidden aria-label="videos.js 내용"></textarea>
    </section>
  </section>

  <section class="gut" id="insta" hidden>
    <div class="vhead"><h2 class="row-title">SNS</h2><button class="vclear" id="iclear" aria-label="메인으로">×</button></div>
    <div class="igrid" id="igrid"></div>
  </section>

  <section class="gut" id="profile" hidden>
    <div class="profile">
      <div class="pphoto"><img id="pimg" alt="지우 프로필 사진"></div>
      <div><h3 class="pname" id="pname"></h3><dl class="pinfo" id="pinfo"></dl></div>
    </div>
  </section>
</main>


<div class="menu" id="menu" hidden role="dialog" aria-modal="true" aria-label="메뉴">
  <div class="top gut">
    <a class="home" href="./" title="메인 화면으로"><span class="logo" role="img" aria-label="쮸카이브"></span></a>
    <button class="burger" id="close-menu" aria-label="메뉴 닫기" style="color:var(--fg)"><svg viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M6 6l18 18M24 6 6 24"/></svg></button>
  </div>
  <div class="menu-body gut">
    <form class="msearch" id="msearch" role="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
      <input id="mq" type="search" placeholder="검색" aria-label="검색" autocomplete="off">
    </form>
    <ul class="mlist" id="mlist"></ul>
  </div>
</div>

<div class="modal" id="modal" hidden>
  <div class="player" role="dialog" aria-modal="true" aria-labelledby="p-title">
    <div class="frame" id="frame"></div>
    <div class="info">
      <div style="min-width:0;flex:1"><div class="meta" id="p-meta"></div><h3 id="p-title"></h3></div>
      <div style="display:flex;gap:12px;align-items:center"><a id="p-link" target="_blank" rel="noopener">유튜브에서 보기 ↗</a><button class="close" id="close">닫기</button></div>
    </div>
  </div>
</div>

<script src="videos.js"></script>
<script src="sns.js"></script>
<script>
// ===== 컴백 테마: 메인 대표 영상 =====
const FEATURED={
  url:"https://youtu.be/roHWN9fL2SM",
  album:"Strange Muse",
  song:"긴 소원 (Birthday Wish)"
};

// ===== 프로필 (사진은 profile.jpg 파일을 바꾸면 돼요. 빈 칸은 화면에 안 나와요) =====
const PROFILE={
  name:"JIWOO",
  photo:"profile.jpg",
  birthday:"2005-04-13",
  debut:"2022-02-22",
  info:[
    ["본명","김지우 (金智佑, Kim Jiwoo)"],
    ["생년월일","2005. 04. 13","age"],
    ["출생지","경기도 남양주시 와부읍 덕소리"],
    ["신체","161cm · AB형 · 240mm"],
    ["가족","아버지, 어머니, 언니"],
    ["반려견","또리, 두유"],
    ["학력","차산초등학교병설유치원 (졸업)\n차산초등학교 (졸업)\n동화중학교 (졸업)\n구리여자고등학교 (중퇴)\n한림연예예술고등학교 연예과 13기 (중퇴)"],
    ["포지션","보컬, 래퍼, 댄서"],
    ["MBTI","INFP"]
  ]
};

const CATS=["무대 & 직캠","자컨 & 예능","라디오","라이브 방송"];
const KEY="jiwoo-archive-drafts";
const $=s=>document.querySelector(s);
let state={view:"home",cat:"전체",q:""};

function ytId(url){
  if(!url) return null;
  const m=url.match(/(?:youtu\.be\/|v=|\/shorts\/|\/embed\/|\/live\/)([\w-]{11})/);
  return m?m[1]:null;
}
function loadDrafts(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return []}}
function saveDrafts(d){try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){}}
function isAdmin(){return location.hash==="#admin"}
function all(){
  const base=(window.VIDEOS||[]).map(v=>({...v}));
  const drafts=isAdmin()?loadDrafts().map(v=>({...v,_draft:true})):[];
  return base.concat(drafts);
}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
const fmt=d=>String(d||"").replaceAll("-",".");

function cardHTML(x,i){
  const id=ytId(x.url);
  const img=id?`<img loading="lazy" src="https://i.ytimg.com/vi/${id}/maxresdefault.jpg" onerror="this.onerror=null;this.src='https://i.ytimg.com/vi/${id}/hqdefault.jpg'" alt="">`:`<div class="nothumb">외부 링크</div>`;
  return `<button class="card" data-i="${i}" title="${esc(x.title)}" aria-label="${esc(x.title)}">${img}</button>`;
}
function bindCards(el,list){el.querySelectorAll(".card").forEach(c=>c.onclick=()=>openVideo(list[+c.dataset.i]))}

/* 대표 영상 */

/* 화면: home(대표 영상 + 최근 추가) / list(메뉴의 카테고리·검색) / profile */
function render(){
  const list=all();
  const home=state.view==="home",prof=state.view==="profile",ins=state.view==="insta";
  $("#hero").hidden=!home;
  $("#videos").hidden=prof||ins;
  $("#insta").hidden=!ins;
  $("#profile").hidden=!prof;
  $("#vclear").hidden=home;
  if(ins){renderInsta();return;}
  if(prof)return;
  const g=$("#grid");
  g.className=home?"shelf":"grid";
  const q=state.q.trim().toLowerCase();
  let v=home?list:list.filter(x=>(state.cat==="전체"||x.category===state.cat)&&(!q||(x.title+" "+(x.note||"")).toLowerCase().includes(q)));
  $("#vtitle").textContent=home?"최근 추가":(state.q?`'${state.q}'`:(state.cat==="전체"?"전체 영상":state.cat));
  v=[...v].sort((a,b)=>String(b.date).localeCompare(a.date));
  if(home)v=v.slice(0,20);
  if(!v.length){g.innerHTML=`<p class="vnone">아직 영상이 없어요.</p>`;return;}
  g.innerHTML=v.map(cardHTML).join("");bindCards(g,v);
}
function renderAll(){render();}
/* 주소(#)로 화면 기억: 새로고침해도 같은 화면에 남아요 */
const SLUG={"무대 & 직캠":"stage","자컨 & 예능":"variety","라디오":"radio","라이브 방송":"live"};
function go(hash){if(location.hash==="#"+hash)route();else location.hash=hash;}
function goVideos({cat,q}){go(q?"search="+encodeURIComponent(q):(SLUG[cat]||"all"));}
function goInsta(){go("sns");}
let igLoaded=false,xLoaded=false;
function loadScript(src){const t=document.createElement("script");t.async=true;t.src=src;document.body.appendChild(t);}
function renderInsta(){
  const list=[...(window.SNS||[])].sort((a,b)=>String(b.date).localeCompare(a.date));
  const g=$("#igrid");
  if(!list.length){g.innerHTML=`<p class="vnone">아직 게시물이 없어요.</p>`;return;}
  if(g.dataset.done)return;
  g.dataset.done="1";
  let hasIg=false,hasX=false;
  g.innerHTML=list.map(x=>{
    const u=String(x.url);
    if(/instagram\.com/.test(u)){hasIg=true;return `<div class="sns"><blockquote class="instagram-media" data-instgrm-permalink="${esc(u)}" data-instgrm-version="14"><a href="${esc(u)}" target="_blank" rel="noopener">인스타그램에서 보기</a></blockquote></div>`;}
    if(/(x|twitter)\.com/.test(u)){hasX=true;const t=u.replace(/\/\/(www\.)?x\.com/,"//twitter.com");return `<div class="sns"><blockquote class="twitter-tweet" data-dnt="true"><a href="${esc(t)}"></a></blockquote></div>`;}
    return `<div class="sns"><a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a></div>`;
  }).join("");
  if(hasIg){if(window.instgrm)window.instgrm.Embeds.process();else if(!igLoaded){igLoaded=true;loadScript("https://www.instagram.com/embed.js");}}
  if(hasX){if(window.twttr&&window.twttr.widgets)window.twttr.widgets.load(g);else if(!xLoaded){xLoaded=true;loadScript("https://platform.twitter.com/widgets.js");}}
}
function goProfile(){go("profile");}
function goHome(){$("#mq").value="";if(location.hash){history.pushState(null,"",location.pathname+location.search);}route();}
function route(){
  const h=location.hash.slice(1);
  const prev=state.view+state.cat+state.q;
  state.cat="전체";state.q="";
  if(h==="profile")state.view="profile";
  else if(h==="sns")state.view="insta";
  else if(h==="all")state.view="list";
  else if(h.startsWith("search=")){state.view="list";try{state.q=decodeURIComponent(h.slice(7))}catch(e){state.q=h.slice(7)}}
  else{const c=Object.keys(SLUG).find(k=>SLUG[k]===h);state.view=c?"list":"home";if(c)state.cat=c;}
  $("#admin").hidden=!isAdmin();
  if(isAdmin())renderDrafts();
  render();
  if(isAdmin())$("#admin").scrollIntoView();
  else if(prev!==state.view+state.cat+state.q)window.scrollTo(0,0);
}
$("#vclear").onclick=goHome;
$("#iclear").onclick=goHome;

function openVideo(x){

  $("#frame").innerHTML=`<iframe src="https://www.youtube.com/embed/${id}?autoplay=1&rel=0&playsinline=1" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" title="${esc(x.title)}"></iframe>`;

/* 유튜브에서 찾기 (관리자) */
const YTK="jiwoo-archive-ytkey",YT="https://www.googleapis.com/youtube/v3/";
try{$("#yt-key").value=localStorage.getItem(YTK)||""}catch(e){}
let ytNext="",ytItems=[],ytStop=false;
function ytMsg(t){$("#yt-msg").textContent=t}
function decodeHTML(t){const d=document.createElement("textarea");d.innerHTML=t;return d.value}
function ytKey(){const k=$("#yt-key").value.trim();if(k){try{localStorage.setItem(YTK,k)}catch(e){}}return k;}
async function ytGet(path,params){
  const r=await fetch(YT+path+"?"+new URLSearchParams({...params,key:ytKey()}));
  const j=await r.json();
  if(j.error)throw new Error(j.error.message||"요청이 거절됐어요.");
  return j;
}
function syncMode(){
  const ch=$("#yt-mode").value==="channel";
  $("#yt-ch-wrap").hidden=!ch;$("#yt-order-wrap").hidden=ch;
  $("#yt-q-label").textContent=ch?"제목에 들어간 단어 (선택)":"검색어";
  $("#yt-q").placeholder=ch?"비워두면 전부 가져와요. 예: 지우, JIWOO":"";
  if(ch&&$("#yt-q").value==="#지우 #NMIXX")$("#yt-q").value="";
  if(!ch&&!$("#yt-q").value)$("#yt-q").value="#지우 #NMIXX";
  $("#yt-go").textContent=ch?"가져오기":"검색";
}
$("#yt-mode").onchange=syncMode;
function ytStatus(id){
  if((window.VIDEOS||[]).some(v=>ytId(v.url)===id))return "목록에 있음";
  if(loadDrafts().some(v=>ytId(v.url)===id))return "추가됨";
  return "";
}
function ytShow(list,append){
  if(!append){ytItems=[];$("#yt-res").innerHTML="";}
  const start=ytItems.length;ytItems=ytItems.concat(list);
  $("#yt-res").insertAdjacentHTML("beforeend",list.map((it,k)=>{
    const st=ytStatus(it.id);
    return `<div class="yt${st?" have":""}" data-id="${it.id}"${st&&$("#yt-hide").checked?" hidden":""}><a href="https://www.youtube.com/watch?v=${it.id}" target="_blank" rel="noopener"><img loading="lazy" src="https://i.ytimg.com/vi/${it.id}/mqdefault.jpg" alt=""></a>
      <div class="t">${esc(it.title)}</div><div class="c">${esc(it.date.replaceAll("-","."))} · ${esc(it.channel)}</div>
      <div class="row"><select aria-label="카테고리"${st?" disabled":""}>${CATS.map(c=>`<option>${c}</option>`).join("")}</select><button data-k="${start+k}" ${st?"disabled":""}>${st||"추가"}</button></div></div>`;
  }).join(""));
}
function ytHaveCount(){const n=ytItems.filter(it=>ytStatus(it.id)).length;return n?` (그중 ${n}개는 이미 목록에 있음)`:"";}
function ytRefreshHidden(){
  const hide=$("#yt-hide").checked;
  $("#yt-res").querySelectorAll(".yt").forEach(el=>{
    const st=ytStatus(el.dataset.id);
    el.classList.toggle("have",!!st);
    el.hidden=!!st&&hide;
    const b=el.querySelector("button"),sel=el.querySelector("select");
    b.disabled=!!st;sel.disabled=!!st;b.textContent=st||"추가";
  });
}
$("#yt-hide").onchange=ytRefreshHidden;
function ytRefreshHiddenSoft(){$("#yt-res").querySelectorAll(".yt").forEach(el=>{const st=ytStatus(el.dataset.id),b=el.querySelector("button"),sel=el.querySelector("select");el.classList.toggle("have",!!st);b.disabled=!!st;sel.disabled=!!st;b.textContent=st||"추가";if(!st)el.hidden=false;});}
function inRange(date){
  const a=$("#yt-after").value,b=$("#yt-before").value;
  return (!a||date>=a)&&(!b||date<=b);
}
async function ytSearch(more){
  const q=$("#yt-q").value.trim();
  if(!q){ytMsg("검색어를 넣어 주세요.");return;}
  const ps={part:"snippet",type:"video",maxResults:"24",q,order:$("#yt-order").value,regionCode:"KR",relevanceLanguage:"ko"};
  if($("#yt-after").value)ps.publishedAfter=$("#yt-after").value+"T00:00:00Z";
  if($("#yt-before").value)ps.publishedBefore=$("#yt-before").value+"T23:59:59Z";
  if(more&&ytNext)ps.pageToken=ytNext;
  ytMsg("검색 중…");
  const j=await ytGet("search",ps);
  ytNext=j.nextPageToken||"";$("#yt-more").hidden=!ytNext;
  ytShow((j.items||[]).filter(it=>it.id&&it.id.videoId).map(it=>({id:it.id.videoId,title:decodeHTML(it.snippet.title),date:it.snippet.publishedAt.slice(0,10),channel:decodeHTML(it.snippet.channelTitle)})),more);
  ytMsg(`${ytItems.length}개 찾았어요${ytHaveCount()}. 넣고 싶은 영상의 카테고리를 고르고 추가를 누르세요.`);
}
async function ytChannel(){
  const raw=$("#yt-ch").value.trim();
  if(!raw){ytMsg("채널 주소나 @아이디를 넣어 주세요.");return;}
  ytMsg("채널 찾는 중…");
  let ch=null;
  const idm=raw.match(/(UC[\w-]{22})/),hm=raw.match(/@([\w.\-]+)/);
  if(idm)ch=(await ytGet("channels",{part:"snippet,contentDetails",id:idm[1]})).items?.[0];
  else if(hm)ch=(await ytGet("channels",{part:"snippet,contentDetails",forHandle:"@"+hm[1]})).items?.[0];
  if(!ch){const sr=await ytGet("search",{part:"snippet",type:"channel",q:raw,maxResults:"1"});const cid=sr.items?.[0]?.id?.channelId;if(cid)ch=(await ytGet("channels",{part:"snippet,contentDetails",id:cid})).items?.[0];}
  if(!ch){ytMsg("채널을 찾지 못했어요. 채널 주소를 그대로 붙여넣어 보세요.");return;}
  const name=decodeHTML(ch.snippet.title),up=ch.contentDetails.relatedPlaylists.uploads;
  const words=$("#yt-q").value.split(/[,|]/).map(w=>w.trim().toLowerCase()).filter(Boolean);
  ytShow([],false);ytStop=false;$("#yt-stop").hidden=false;$("#yt-more").hidden=true;
  let token="",scanned=0,page=0;
  do{
    const j=await ytGet("playlistItems",{part:"snippet,contentDetails",playlistId:up,maxResults:"50",...(token?{pageToken:token}:{})});
    token=j.nextPageToken||"";page++;
    const list=(j.items||[]).map(it=>({id:it.contentDetails.videoId,title:decodeHTML(it.snippet.title),date:(it.contentDetails.videoPublishedAt||it.snippet.publishedAt||"").slice(0,10),channel:name}))
      .filter(v=>v.id&&v.title!=="Private video"&&v.title!=="Deleted video");
    scanned+=list.length;
    const hit=list.filter(v=>inRange(v.date)&&(!words.length||words.some(w=>v.title.toLowerCase().includes(w))));
    if(hit.length)ytShow(hit,true);
    ytMsg(`${name}: 영상 ${scanned}개 훑는 중… 찾은 영상 ${ytItems.length}개`);
    const a=$("#yt-after").value;
    if(a&&list.length&&list[list.length-1].date<a)break;
  }while(token&&!ytStop&&page<80);
  $("#yt-stop").hidden=true;
  ytMsg(`${name}: 영상 ${scanned}개 중 ${ytItems.length}개를 찾았어요${ytHaveCount()}.${ytStop?" (중간에 멈춤)":""} 넣고 싶은 영상의 카테고리를 고르고 추가를 누르세요.`);
}
$("#yt-go").onclick=async()=>{
  if(!ytKey()){ytMsg("API 키를 넣어 주세요.");return;}
  try{if($("#yt-mode").value==="channel")await ytChannel();else await ytSearch(false);}
  catch(e){$("#yt-stop").hidden=true;ytMsg("안 됐어요: "+e.message);}
};
$("#yt-more").onclick=async()=>{try{await ytSearch(true)}catch(e){ytMsg("안 됐어요: "+e.message)}};
$("#yt-stop").onclick=()=>{ytStop=true;};
$("#yt-res").addEventListener("click",e=>{
  const b=e.target.closest("button[data-k]");if(!b||b.disabled)return;
  const it=ytItems[+b.dataset.k];
  const d=loadDrafts();
  d.push({url:"https://youtu.be/"+it.id,title:it.title,date:it.date,category:b.previousElementSibling.value,group:"단독",note:""});
  saveDrafts(d);b.disabled=true;b.textContent="추가됨";
  renderDrafts();renderAll();
});

/* 관리자 */
$("#f-cat").innerHTML=CATS.map(c=>`<option>${c}</option>`).join("");
$("#f-date").value=new Date().toISOString().slice(0,10);
function msg(t){$("#msg").textContent=t}
$("#f-url").addEventListener("change",async()=>{
  const id=ytId($("#f-url").value);
  if(!id){msg("유튜브 링크 형식이 아니에요. 링크를 다시 확인해 주세요.");return;}
  msg("제목 가져오는 중…");
  try{
    const r=await fetch(`https://noembed.com/embed?url=${encodeURIComponent("https://www.youtube.com/watch?v="+id)}`);
    const j=await r.json();
    if(j.title){if(!$("#f-title").value)$("#f-title").value=j.title;msg("제목을 가져왔어요.");}
    else msg("제목을 못 가져왔어요. 직접 입력해 주세요.");
  }catch(e){msg("제목을 못 가져왔어요. 직접 입력해 주세요.");}
});
$("#add").onclick=()=>{
  const url=$("#f-url").value.trim(),title=$("#f-title").value.trim();
  if(!ytId(url)){msg("유튜브 링크를 넣어 주세요.");return;}
  if(!title){msg("제목을 입력해 주세요.");return;}
  const st=ytStatus(ytId(url));
  if(st){msg(st==="목록에 있음"?"이미 사이트에 올라가 있는 영상이에요.":"이미 미리보기 목록에 추가한 영상이에요.");return;}
  const d=loadDrafts();
  d.push({url,title,date:$("#f-date").value,category:$("#f-cat").value,group:$("#f-group").value,note:$("#f-note").value.trim()});
  saveDrafts(d);
  $("#f-url").value="";$("#f-title").value="";$("#f-note").value="";
  msg(`"${title}" 추가됨. 아직 이 브라우저에서만 보여요.`);
  renderDrafts();renderAll();
};
function renderDrafts(){
  if(typeof ytRefreshHidden==="function"&&$("#yt-res").children.length)ytRefreshHiddenSoft();
  const d=loadDrafts();
  $("#drafts").innerHTML=d.map((x,i)=>`<div class="draft"><span>${esc(x.date)} · ${esc(x.category)} · ${esc(x.title)}</span><button data-i="${i}" aria-label="삭제">삭제</button></div>`).join("");
  $("#drafts").querySelectorAll("button").forEach(b=>b.onclick=()=>{const d=loadDrafts();d.splice(+b.dataset.i,1);saveDrafts(d);renderDrafts();renderAll();});
}
$("#export").onclick=async()=>{
  const merged=(window.VIDEOS||[]).concat(loadDrafts());
  const lines=merged.map(v=>"  "+JSON.stringify({url:v.url,title:v.title,date:v.date,category:v.category,group:v.group,note:v.note||""})+",");
  const text=`// 쮸카이브 영상 목록 (관리자 화면에서 생성)\n// category: 무대 & 직캠 / 자컨 & 예능 / 라디오 / 라이브 방송, group: 단독 / 단체\n\nwindow.VIDEOS = [\n${lines.join("\n")}\n];\n`;
  const out=$("#out");out.value=text;out.hidden=false;
  try{await navigator.clipboard.writeText(text);msg("복사했어요. videos.js 파일 내용을 전부 바꾼 뒤 '미리보기 비우기'를 누르면 돼요.");}
  catch(e){out.select();msg("자동 복사가 안 돼서 아래 칸을 선택해 두었어요. Ctrl+C로 복사하세요.");}
};
$("#clear").onclick=()=>{saveDrafts([]);renderDrafts();renderAll();msg("미리보기를 비웠어요.");};

window.addEventListener("popstate",route);
route();
