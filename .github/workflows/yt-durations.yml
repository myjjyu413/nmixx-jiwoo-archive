name: YouTube durations
on:
  workflow_dispatch:
    inputs:
      cat:
        description: "category"
        required: false
        default: "숏폼"
jobs:
  dur:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tools/yt-durations.mjs
        env:
          CAT: ${{ github.event.inputs.cat }}
